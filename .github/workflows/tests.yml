# Runs every test in tests/ on a Mac and a Windows machine for each push and pull request.
# A failing test blocks the pull request (see docs/spec/12-engineering.md, "Tests").
name: Tests

on:
  push:
    branches: [main]      # branches with a pull request run through pull_request (once, not twice)
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            name: Mac
          - runner: windows-latest
            name: Windows
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=cryptography -r requirements.txt
      - name: Run all tests
        run: python tests/run_all.py
      - name: Keep the generated test archive for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.name }}
          path: tests/work/Archive
          if-no-files-found: ignore
          retention-days: 7
